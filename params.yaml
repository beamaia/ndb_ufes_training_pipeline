project: multiclass
run_name: ""

dataset:
  organizer: ../ndb_ufes_data_organizer # the data organizer repository, relative to this one
  folds_csv: results/phase1/folds/fold_assignments.csv # the paths below start at the organizer repository
  patch_dir: data/ndb_ufes/patch_level/images
  patch_table: results/phase0/dataset_tables/patch_table_public.csv # gives the picture of each patch; null leaves out the per-picture and per-patient metrics
  folds: [0, 1, 2, 3, 4, 5]
  test_fold: 5 # kept out of the cross-validation; every fold model is tested on it
  source_zip: https://data.mendeley.com/public-api/zip/bbmmm4wgr8/download/4 # the public NDB-UFES zip; --download-data takes the patch images that are missing from it

run:
  purpose: final # the MLflow experiment is ndb_ufes_<purpose>
  suffix: "" # added to the run names
  hourly_cost: null # price of the machine per hour in dollars; the cost of the run is logged
  tracking_uri: null # the MLflow server; null uses MLFLOW_TRACKING_URI from .env, then http://localhost:8000/
  last_checkpoints: 1 # each fold keeps its best checkpoint and the checkpoint of its last epoch; the older ones are deleted (0 keeps only the best)
  num_workers: 8 # processes that load and augment the images (0 does it in the main process, which is several times slower); the same seed gives the same run only with the same number, so it is part of the protocol
  checkpoints_in_mlflow: false # true also copies every checkpoint into MLflow, which doubles the disk space

training:
  mode: finetune # end to end

early_stopping:
  enabled: true
  patience: 15
  min_delta: 0.001
  mode: all

experiment:
  models:
    - resnet50
    - mobilenetv2
    - densenet121
    - vgg16
    - coat_lite_small
    - pit_s_distilled_224
    - vit_small_patch16_384

hyperparameters:
  optimizer:
    name: sgd
    learning_rate: 0.001
    momentum: 0.9
  scheduler:
    name: reduce_lr_on_plateau
    other:
      mode: min
      factor: 0.1
      patience: 10
      min_lr: 0.000001
  model:
    name: resnet50
  other:
    loss: cross_entropy
    loss_weights: true
    epochs: 150
    batch_size: 30

device: auto
node_type: float32
seed: 42
