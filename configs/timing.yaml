# One epoch of each model: the seven of the article and the five added after it. It shows that every model builds, loads its weights and trains on this machine,
# and how long an epoch takes (the seconds per epoch and per fold are logged to MLflow). It goes to the experiment ndb_ufes_trial.
# Use it with:  uv run python main.py --params configs/timing.yaml
extends: trial.yaml
run:
  last_checkpoints: 0 # with one epoch the best and the last checkpoint are the same weights; the 12 models would fill the volume
experiment:
  models:
    - resnet50
    - mobilenetv2
    - densenet121
    - vgg16
    - coat_lite_small
    - pit_s_distilled_224
    - vit_small_patch16_384
    - efficientnet_b0
    - efficientnet_b3
    - swin_tiny_patch4_window7_224
    - swin_base_patch4_window7_224
    - convnext_large
hyperparameters:
  other:
    epochs: 1
